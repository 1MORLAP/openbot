plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'run.openbot'
version = '1.0.0'

android {
  namespace "run.openbot.displayzoom"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    consumerProguardFiles 'consumer-rules.pro'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
}
